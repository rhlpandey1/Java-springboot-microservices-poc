# Deployment = long-running Java microservice, 2 replicas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
  namespace: qa
spec:
  replicas: 2
  selector:
    matchLabels: { app: java-app }
  template:
    metadata:
      labels: { app: java-app }
    spec:
      containers:
        - name: java-app
          image: demo-java-app-micro:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080            # Spring Boot default port
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10           # JVM needs a bit longer to boot than Node
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
          resources:
            requests: { memory: "256Mi", cpu: "250m" }
            limits:   { memory: "512Mi", cpu: "500m" }
---
apiVersion: v1
kind: Service
metadata:
  name: java-app                              # DNS name to reach the service
  namespace: qa
spec:
  type: ClusterIP
  selector: { app: java-app }
  ports:
    - port: 80
      targetPort: 8080